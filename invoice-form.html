<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice PDF Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    background: #f4f6f8;
    color: #1f2933;
    margin: 0;
    padding: 30px 16px;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin: 0 0 20px; color: #1a4d8f; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=date], input[type=number], input[type=url] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d3d9de;
    border-radius: 6px;
    font-size: 14px;
  }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  .items-header, .item-row {
    display: grid;
    grid-template-columns: 1fr 70px 90px 32px;
    gap: 8px;
    align-items: center;
  }
  .items-header { font-size: 12px; color: #667; margin-top: 18px; }
  .item-row { margin-top: 6px; }
  .item-row button {
    background: #fdecea; color: #c0392b; border: none; border-radius: 6px;
    width: 32px; height: 32px; cursor: pointer; font-size: 16px; line-height: 1;
  }
  #addItem {
    margin-top: 10px; background: none; border: 1px dashed #9aa5b1;
    color: #4a5561; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .actions { margin-top: 24px; display: flex; gap: 10px; align-items: center; }
  button.primary {
    background: #1a4d8f; color: #fff; border: none; padding: 10px 20px;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  button.primary:disabled { background: #9aa5b1; cursor: not-allowed; }
  #status { font-size: 13px; }
  #result { margin-top: 18px; }
  #result a {
    display: inline-block; background: #1e7e34; color: #fff; padding: 9px 16px;
    border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600;
  }
  #result a:hover { background: #196a2b; }
  #result a.download-link { background: #1a4d8f; }
  #result a.download-link:hover { background: #153e73; }
  #result .result-links { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #result .generated-at { margin-top: 8px; font-size: 13px; color: #445; }
  #result .file-name { font-size: 13px; color: #667; word-break: break-all; }
  #result pre { background: #f4f6f8; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
  #result iframe { width: 100%; height: 480px; border: 1px solid #d3d9de; border-radius: 6px; margin-top: 12px; }
  .webhook-url { margin-top: 22px; }
  .webhook-url small { color: #667; }
  .error { color: #c0392b; }
</style>
</head>
<body>
<div class="card">
  <h1>Invoice → PDF</h1>

  <div class="row">
    <div>
      <label>Invoice No.</label>
      <input type="text" id="invoiceNo" value="INV-1004">
    </div>
    <div>
      <label>Date</label>
      <input type="date" id="date">
    </div>
  </div>

  <label>Customer Name</label>
  <input type="text" id="customerName" value="Faisal Ahmed">

  <label>Customer Address</label>
  <input type="text" id="customerAddress" value="Dhaka, Bangladesh">

  <div class="items-header">
    <div>Item</div><div>Qty</div><div>Price</div><div></div>
  </div>
  <div id="items"></div>
  <button id="addItem" type="button">+ Add item</button>

  <div class="actions">
    <button class="primary" id="submitBtn" type="button">Generate PDF</button>
    <span id="status"></span>
  </div>

  <div id="result"></div>

  <div class="webhook-url">
    <label>Webhook URL</label>
    <input type="url" id="webhookUrl" value="http://localhost:5678/webhook/generate-pdf">
    <small>Use <code>/webhook-test/generate-pdf</code> instead while the workflow editor is open and listening for a test event; use <code>/webhook/generate-pdf</code> once the workflow is activated.</small>
  </div>
</div>

<script>
  const itemsEl = document.getElementById('items');

  function formatTimestamp(date) {
    return date.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
  }

  // Content-Disposition is only readable if n8n exposes it via CORS; otherwise returns null.
  function fileNameFromResponse(res) {
    const disposition = res.headers.get('Content-Disposition') || '';
    const match = disposition.match(/filename\*?=(?:UTF-8'')?"?([^";]+)"?/i);
    return match ? decodeURIComponent(match[1]) : null;
  }

  function isPdf(bytes) {
    // every PDF starts with "%PDF"
    return bytes.length >= 4 && bytes[0] === 0x25 && bytes[1] === 0x50 && bytes[2] === 0x44 && bytes[3] === 0x46;
  }

  let currentPdfUrl = null;

  function showPdf(blob, fileName, generatedAt) {
    if (currentPdfUrl) URL.revokeObjectURL(currentPdfUrl);
    currentPdfUrl = URL.createObjectURL(blob);

    const resultEl = document.getElementById('result');
    resultEl.innerHTML = `
      <div class="result-links">
        <a class="view-link" target="_blank" rel="noopener">View PDF</a>
        <a class="download-link">Download PDF</a>
        <span class="file-name"></span>
      </div>
      <div class="generated-at"></div>
      <iframe title="Invoice PDF preview"></iframe>
    `;
    resultEl.querySelector('.view-link').href = currentPdfUrl;
    resultEl.querySelector('.file-name').textContent = fileName;
    const downloadLink = resultEl.querySelector('.download-link');
    downloadLink.href = currentPdfUrl;
    downloadLink.download = fileName;
    const generatedEl = resultEl.querySelector('.generated-at');
    generatedEl.textContent = 'Generated: ' + formatTimestamp(generatedAt);
    generatedEl.title = generatedAt.toISOString();
    resultEl.querySelector('iframe').src = currentPdfUrl;
  }

  function addItemRow(name = '', qty = 1, price = 0) {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" class="item-name" placeholder="Item name" value="${name}">
      <input type="number" class="item-qty" min="1" value="${qty}">
      <input type="number" class="item-price" min="0" step="0.01" value="${price}">
      <button type="button" class="removeItem">&times;</button>
    `;
    row.querySelector('.removeItem').addEventListener('click', () => row.remove());
    itemsEl.appendChild(row);
  }

  addItemRow('API Development', 2, 500);
  addItemRow('Hosting (1 year)', 1, 120);

  document.getElementById('addItem').addEventListener('click', () => addItemRow());
  document.getElementById('date').value = new Date().toISOString().slice(0, 10);

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const submitBtn = document.getElementById('submitBtn');
    resultEl.innerHTML = '';
    statusEl.textContent = '';
    statusEl.className = '';

    const items = [...itemsEl.querySelectorAll('.item-row')].map(row => ({
      name: row.querySelector('.item-name').value.trim(),
      qty: Number(row.querySelector('.item-qty').value),
      price: Number(row.querySelector('.item-price').value)
    }));

    const payload = {
      invoice_no: document.getElementById('invoiceNo').value.trim(),
      date: document.getElementById('date').value,
      customer: {
        name: document.getElementById('customerName').value.trim(),
        address: document.getElementById('customerAddress').value.trim()
      },
      items,
      generated_at: new Date().toISOString()
    };

    if (!payload.invoice_no || !payload.customer.name || items.some(i => !i.name)) {
      statusEl.textContent = 'Please fill in invoice number, customer name, and all item names.';
      statusEl.className = 'error';
      return;
    }

    const webhookUrl = document.getElementById('webhookUrl').value.trim();
    submitBtn.disabled = true;
    statusEl.textContent = 'Generating PDF...';

    try {
      const res = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error(`Server responded with ${res.status}`);
      }

      const bytes = new Uint8Array(await res.arrayBuffer());
      if (!isPdf(bytes)) {
        // n8n sent something other than a PDF (e.g. a JSON error) - show it
        statusEl.textContent = 'The webhook did not return a PDF.';
        statusEl.className = 'error';
        resultEl.innerHTML = '<pre></pre>';
        resultEl.querySelector('pre').textContent = new TextDecoder().decode(bytes).slice(0, 2000);
        return;
      }

      const generatedAt = new Date();
      const fileName = fileNameFromResponse(res) || `${payload.invoice_no}-${generatedAt.getTime()}.pdf`;
      statusEl.textContent = 'Done.';
      statusEl.className = '';
      showPdf(new Blob([bytes], { type: 'application/pdf' }), fileName, generatedAt);
    } catch (err) {
      statusEl.textContent = 'Error: ' + err.message;
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
